---

base_locale: en
locales: [en]

ignore_unused:
  - "decidim.components.extra_censuses.name"
  - "decidim.elections.admin.censuses.custom_csv_form.*"
  - "decidim.elections.admin.census_updates.*"
  - "decidim.elections.censuses.custom_csv.*"
  - "decidim.elections.votes.question.choices_out_of_range"
  - "decidim.elections.votes.question.choices_range"
  - "decidim.elections.votes.question.min_choices"
  - "decidim.elections.votes.question.min_choices_not_met"
  - "decidim.admin.menu.elections_menu.*"
  - "activemodel.attributes.custom_csv.*"
  - "activemodel.attributes.question.*"
  - "activemodel.errors.models.custom_csv.*"

ignore_missing:
  - decidim.participatory_processes.scopes.global
  - decidim.elections.admin.census.update.success
  - decidim.elections.admin.census.update.error
  - decidim.elections.votes.cast.invalid
  - decidim.elections.votes.cast.success
  - decidim.forms.admin.questionnaires.question.any
  # Upstream keys provided by decidim-elections / decidim-forms locale files.
  - decidim.elections.admin.dashboard.questions_table.total
  - decidim.elections.admin.dashboard.questions_table.votes_count
  - decidim.elections.elections.vote_results.total
  - decidim.elections.elections.vote_results.total_votes
  - decidim.elections.votes.question.max_choices_alert
  - decidim.forms.admin.questionnaires.question.add_response_option
  - decidim.forms.admin.questionnaires.response_option.remove
  - decidim.forms.admin.questionnaires.response_option.response_option
  - decidim.forms.admin.questionnaires.response_option.statement
